name: Static checks
on:
  push:
  pull_request:
jobs:
  python-syntax-and-input-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python scripts
        run: python -m compileall -q .
      - name: Verify input-data manifest
        run: python tools/verify_input_manifest.py
      - name: List workflow
        run: python run_all.py --profile full --list
